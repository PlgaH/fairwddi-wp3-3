<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" width="100%" height="100%">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="620" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Banner: DDIIdentifiable Mixin -->
  <rect x="25" y="15" width="570" height="45" rx="8" fill="#1e293b" filter="url(#boxShadow)"/>
  <text x="40" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">ABSTRACT BASE MIXIN</text>
  <text x="40" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Inherited by all 15 Core Tables</text>
  <rect x="230" y="24" width="350" height="26" rx="6" fill="#334155"/>
  <text x="240" y="41" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#f1f5f9">DDIIdentifiable: urn | agency | version | content_hash (SHA-256)</text>

  <!-- 1. Concept Layer -->
  <rect x="25" y="70" width="275" height="115" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#boxShadow)"/>
  <rect x="35" y="78" width="100" height="18" rx="4" fill="#4338ca"/>
  <text x="85" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">CONCEPT (2)</text>
  
  <rect x="35" y="102" width="120" height="32" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="42" y="117" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#312e81">Concept</text>
  <text x="42" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">SKOS hierarchy &amp; URI</text>

  <rect x="165" y="102" width="125" height="32" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="172" y="117" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#312e81">ConceptualVariable</text>
  <text x="172" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">Measurement intent</text>

  <text x="35" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">• Anchors to CESSDA ELSST R6</text>
  <text x="35" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">• Multi-language labels JSONB</text>

  <!-- 2. Representation Layer -->
  <rect x="315" y="70" width="280" height="195" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#boxShadow)"/>
  <rect x="325" y="78" width="145" height="18" rx="4" fill="#0f766e"/>
  <text x="397" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">REPRESENTATION (7)</text>

  <rect x="325" y="102" width="125" height="32" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="332" y="116" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#134e4a">QuestionItem</text>
  <text x="332" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">Reusable question text</text>

  <rect x="460" y="102" width="125" height="32" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="467" y="116" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#134e4a">RepresentedVar</text>
  <text x="467" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">Question + CodeList</text>

  <rect x="325" y="140" width="80" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="330" y="154" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#134e4a">Category</text>
  <text x="330" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Label JSONB</text>

  <rect x="412" y="140" width="85" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="417" y="154" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#134e4a">CategorySet</text>
  <text x="417" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Set schemes</text>

  <rect x="504" y="140" width="80" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="509" y="154" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#134e4a">CodeList</text>
  <text x="509" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Code mappings</text>

  <rect x="325" y="178" width="125" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="332" y="193" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#134e4a">CodeItem</text>

  <rect x="460" y="178" width="125" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="467" y="193" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#134e4a">CategorySetItem</text>

  <text x="325" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0f766e">✓ Decoupled numerical codes from category labels</text>
  <text x="325" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0f766e">✓ Order-independent set hashing (ucl-... / ucs-...)</text>
  <text x="325" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0f766e">✓ Native multilingual JSONB arrays: [{"lang":"fr"}]</text>

  <!-- 3. Dataset Layer -->
  <rect x="25" y="195" width="275" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#boxShadow)"/>
  <rect x="35" y="202" width="105" height="18" rx="4" fill="#991b1b"/>
  <text x="87" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">DATASET (2)</text>

  <rect x="35" y="226" width="120" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="42" y="240" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#991b1b">StudyUnit</text>
  <text x="42" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Renamed from Survey</text>

  <rect x="165" y="226" width="125" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="172" y="240" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#991b1b">InstanceVariable</text>
  <text x="172" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">Physical column bind</text>

  <!-- 4. Organization & Staging Layers (Bottom Rows) -->
  <rect x="25" y="275" width="275" height="185" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#boxShadow)"/>
  <rect x="35" y="283" width="130" height="18" rx="4" fill="#475569"/>
  <text x="100" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">ORGANIZATION (5)</text>

  <rect x="35" y="307" width="120" height="26" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="42" y="323" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#334155">VariableGroup</text>

  <rect x="165" y="307" width="125" height="26" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="172" y="323" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#334155">VarGroupMember</text>

  <rect x="35" y="338" width="80" height="26" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="354" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700" fill="#334155">Distributor</text>

  <rect x="122" y="338" width="80" height="26" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="127" y="354" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700" fill="#334155">Collection</text>

  <rect x="209" y="338" width="80" height="26" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="214" y="354" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700" fill="#334155">Subcollect</text>

  <text x="35" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569">• Survey themes &amp; groupings</text>
  <text x="35" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569">• Archive series hierarchy</text>
  <text x="35" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569">• Zero-data-loss mapping</text>

  <!-- 5. Staging & Infrastructure Layer -->
  <rect x="315" y="275" width="280" height="185" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#boxShadow)"/>
  <rect x="325" y="283" width="165" height="18" rx="4" fill="#0369a1"/>
  <text x="407" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">STAGING &amp; AUDIT (4)</text>

  <rect x="325" y="307" width="125" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="332" y="321" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#0284c7">StagedImport</text>
  <text x="332" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Raw file payload bundle</text>

  <rect x="460" y="307" width="125" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="467" y="321" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#0284c7">StagedNode</text>
  <text x="467" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Raw resource element</text>

  <rect x="325" y="344" width="125" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="332" y="358" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#0284c7">URNAlias</text>
  <text x="332" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Random ➔ Canonical map</text>

  <rect x="460" y="344" width="125" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="467" y="358" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#0284c7">Quarantine</text>
  <text x="467" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#64748b">Conflicting drift review</text>

  <text x="325" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7">• Stage 1 high-speed ingestion cache</text>
  <text x="325" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7">• Prevents HTTP web timeout on large XML</text>
  <text x="325" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7">• Audit provenance preservation</text>
</svg>
