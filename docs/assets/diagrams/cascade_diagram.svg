<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="conceptGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="repGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="620" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Concept Layer Box -->
  <rect x="25" y="20" width="570" height="110" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="35" y="28" width="120" height="24" rx="12" fill="url(#conceptGrad)"/>
  <text x="95" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CONCEPT LAYER</text>

  <!-- ConceptualVariable Card -->
  <rect x="175" y="40" width="400" height="72" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="195" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#312e81">ConceptualVariable</text>
  <text x="195" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#4b5563">Abstract Measurement Intent (e.g., "Political Orientation")</text>
  <rect x="195" y="93" width="180" height="15" rx="3" fill="#ede9fe"/>
  <text x="200" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#6d28d9">🔗 Anchored to CESSDA ELSST Thesaurus</text>

  <!-- Arrow 1 -->
  <line x1="375" y1="130" x2="375" y2="162" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Representation Layer Box -->
  <rect x="25" y="165" width="570" height="175" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="35" y="173" width="165" height="24" rx="12" fill="url(#repGrad)"/>
  <text x="117" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">REPRESENTATION LAYER</text>

  <!-- QuestionItem Box -->
  <rect x="40" y="208" width="255" height="115" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
  <text x="55" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#134e4a">QuestionItem (Reusable)</text>
  <text x="55" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• Literal Question Text</text>
  <text x="55" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• Interviewer Instructions</text>
  <text x="55" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• Pre/Post Routing Prompts</text>
  <rect x="55" y="295" width="135" height="18" rx="3" fill="#ccfbf1"/>
  <text x="60" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#0f766e">Multilingual JSONB [FR, EN]</text>

  <!-- CodeList Box -->
  <rect x="325" y="208" width="255" height="115" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
  <text x="340" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#134e4a">CodeList &amp; Category</text>
  <text x="340" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• Code 1 ➔ "Gauche" / "Left"</text>
  <text x="340" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• Code 2 ➔ "Droite" / "Right"</text>
  <text x="340" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• Decoupled numerical codes</text>
  <rect x="340" y="295" width="155" height="18" rx="3" fill="#ccfbf1"/>
  <text x="345" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#0f766e">Set-Theoretic Hash (ucl-...)</text>

  <!-- Synthesis Badge -->
  <rect x="210" y="325" width="200" height="20" rx="10" fill="#042f2e"/>
  <text x="310" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Synthesized as RepresentedVariable</text>

  <!-- Arrow 2 -->
  <line x1="310" y1="345" x2="310" y2="370" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Dataset Layer Box -->
  <rect x="25" y="375" width="570" height="88" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="35" y="383" width="135" height="24" rx="12" fill="url(#dataGrad)"/>
  <text x="102" y="399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DATASET LAYER</text>

  <!-- InstanceVariable Card -->
  <rect x="185" y="385" width="395" height="68" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
  <text x="205" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#7f1d1d">InstanceVariable</text>
  <text x="205" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Physical Survey Column binding in <tspan font-weight="700" fill="#991b1b">StudyUnit</tspan> (e.g. ELIPSS Wave 2022)</text>
  <rect x="205" y="432" width="225" height="16" rx="3" fill="#fee2e2"/>
  <text x="210" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#b91c1c">URN: urn:ddi:fr.cdsp:InstanceVariable:...</text>
</svg>
