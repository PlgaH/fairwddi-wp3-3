<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="620" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top: 2-Tier Strategy Header -->
  <rect x="25" y="15" width="570" height="38" rx="8" fill="#0f172a" filter="url(#shadow)"/>
  <text x="310" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">TWO-TIER HASHING &amp; SET-THEORETIC FINGERPRINTING</text>

  <!-- Tier 1 Box -->
  <g transform="translate(25, 65)">
    <rect width="275" height="155" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="10" y="10" width="130" height="20" rx="4" fill="#0284c7"/>
    <text x="75" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">TIER 1: SIMPLE TEXT</text>
    
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Base Atomic Entities</text>
    <text x="12" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">Category, Concept, VariableGroup</text>

    <rect x="10" y="75" width="255" height="34" rx="4" fill="#0f172a"/>
    <text x="18" y="90" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#38bdf8">hash = SHA256(canonical_text)</text>
    <text x="18" y="102" font-family="JetBrains Mono, monospace" font-size="8" fill="#94a3b8">NFKC normalize + lang code</text>

    <text x="12" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7">✓ Language-level atomic isolation</text>
    <text x="12" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7">✓ Native PostgreSQL pgcrypto</text>
  </g>

  <!-- Tier 2 Box -->
  <g transform="translate(320, 65)">
    <rect width="275" height="155" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="10" y="10" width="155" height="20" rx="4" fill="#7c3aed"/>
    <text x="87" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">TIER 2: COMPOUND URN</text>

    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Higher-Order Structures</text>
    <text x="12" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">QuestionItem, CodeList, RepresentedVar</text>

    <rect x="10" y="75" width="255" height="34" rx="4" fill="#0f172a"/>
    <text x="18" y="90" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#c084fc">hash = SHA256(child_urn_1 + ...)</text>
    <text x="18" y="102" font-family="JetBrains Mono, monospace" font-size="8" fill="#94a3b8">Hashes child canonical URNs</text>

    <text x="12" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7c3aed">✓ Decouples structure from text edits</text>
    <text x="12" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7c3aed">✓ Prevents cascading re-indexing</text>
  </g>

  <!-- Set Hashing Breakthrough Box -->
  <g transform="translate(25, 230)">
    <rect width="570" height="115" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="15" y="10" width="220" height="20" rx="4" fill="#15803d"/>
    <text x="125" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">ORDER-INDEPENDENT SET HASHING</text>
    <text x="245" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#15803d">Eliminates 70% of false-positive drift alarms!</text>

    <text x="15" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">In XML exports, response categories often appear in random order between waves.</text>
    <text x="15" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">We sort <tspan font-family="JetBrains Mono, monospace" font-weight="600" fill="#15803d">code_value:category_urn</tspan> alphabetically before hashing (e.g. <tspan font-family="JetBrains Mono, monospace" font-size="9.5" fill="#14532d">ucl-fr-a8b2c4...</tspan>).</text>

    <rect x="15" y="74" width="540" height="28" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="25" y="92" font-family="JetBrains Mono, monospace" font-size="9" fill="#15803d">UnorderedCodeList: {"1": "cat-fr-12", "2": "cat-fr-34"} == {"2": "cat-fr-34", "1": "cat-fr-12"}</text>
  </g>

  <!-- Bottom: URN Taxonomy & URNAlias Bridge / Quarantine -->
  <g transform="translate(25, 355)">
    <!-- URN Taxonomy & Alias Bridge -->
    <rect width="275" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="15" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">URN Types &amp; URNAlias Bridge</text>
    
    <rect x="12" y="28" width="250" height="34" rx="4" fill="#0f172a"/>
    <text x="18" y="42" font-family="JetBrains Mono, monospace" font-size="7.5" fill="#38bdf8">Canonical: <tspan font-weight="700" fill="#facc15">cat-fr-e7f2b1c4a9d8:1.0</tspan></text>
    <text x="18" y="54" font-family="JetBrains Mono, monospace" font-size="7.5" fill="#94a3b8">External:  <tspan fill="#a78bfa">urn:ddi:uk.closer:var_01</tspan></text>

    <rect x="12" y="66" width="250" height="36" rx="4" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0369a1">🔗 URNAlias Glue Table:</text>
    <text x="18" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#0c4a6e">Maps multiple harvest URNs ➔ single canonical ID.</text>

    <!-- Quarantine -->
    <rect x="295" width="275" height="110" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="310" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">MetadataQuarantine Safety Gate</text>

    <text x="310" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569">If an incoming record matches an existing URN</text>
    <text x="310" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569">but has differing content hashes (metadata drift):</text>

    <rect x="310" y="66" width="245" height="30" rx="4" fill="#ffffff" stroke="#f87171"/>
    <text x="318" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#dc2626">🚨 Auto-routed to Archivist QA Queue</text>
  </g>
</svg>
