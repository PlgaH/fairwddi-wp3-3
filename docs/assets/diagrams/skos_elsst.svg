<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="skosGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="620" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Banner -->
  <rect x="25" y="15" width="570" height="42" rx="8" fill="url(#skosGrad)" filter="url(#shadow)"/>
  <text x="40" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">CESSDA ELSST R6 &amp; SKOS / XKOS INGESTION ENGINE</text>
  <rect x="465" y="24" width="115" height="24" rx="12" fill="#ffffff"/>
  <text x="522" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4338ca" text-anchor="middle">3,470 CONCEPTS</text>

  <!-- Left Col: RDF Parser & CLI -->
  <g transform="translate(25, 70)">
    <rect width="275" height="385" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="15" y="12" width="160" height="22" rx="4" fill="#0f172a"/>
    <text x="95" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">GENERIC RDFLib LOADER</text>

    <text x="15" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Multi-Format SKOS Ingestion</text>
    <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">Turtle (.ttl), RDF/XML, JSON-LD, N-Triples</text>

    <!-- CLI Box -->
    <rect x="12" y="85" width="250" height="75" rx="6" fill="#0f172a"/>
    <text x="20" y="103" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#94a3b8"># Ingest with depth filter</text>
    <text x="20" y="118" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#38bdf8">fairwddi db load-vocab \</text>
    <text x="25" y="132" font-family="JetBrains Mono, monospace" font-size="9" fill="#f8fafc">vocab/ELSST_R6.ttl \</text>
    <text x="25" y="146" font-family="JetBrains Mono, monospace" font-size="9" fill="#facc15">--levels 2</text>

    <text x="15" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Hierarchy &amp; Relationship Mapping</text>
    <text x="15" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">• <tspan font-family="JetBrains Mono, monospace" fill="#4338ca">skos:broader</tspan> ➔ Concept.parent</text>
    <text x="15" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">• <tspan font-family="JetBrains Mono, monospace" fill="#4338ca">skos:narrower</tspan> ➔ Bidirectional traversal</text>
    <text x="15" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">• <tspan font-family="JetBrains Mono, monospace" fill="#4338ca">skos:prefLabel</tspan> ➔ JSONB {"fr", "en", "de"}</text>
    <text x="15" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">• <tspan font-family="JetBrains Mono, monospace" fill="#4338ca">skos:altLabel</tspan> ➔ Synonyms &amp; Search</text>

    <!-- Audit CLI -->
    <rect x="12" y="265" width="250" height="50" rx="6" fill="#0f172a"/>
    <text x="20" y="283" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#94a3b8"># Check inventory &amp; versions</text>
    <text x="20" y="300" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#38bdf8">fairwddi db check-vocab</text>

    <text x="15" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#0f766e">✓ Pre-flight "already loaded" detection</text>
    <text x="15" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#0f766e">✓ Sub-second tree traversal</text>
    <text x="15" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#0f766e">✓ Vocabulary-agnostic schema</text>
  </g>

  <!-- Right Col: Visual Concept Tree -->
  <g transform="translate(320, 70)">
    <rect width="275" height="385" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="15" y="12" width="170" height="22" rx="4" fill="#4338ca"/>
    <text x="100" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ELSST MULTILINGUAL TREE</text>

    <!-- Top Node: POLITICS -->
    <rect x="25" y="48" width="225" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="35" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4338ca">POLITICS (Top Level)</text>
    <text x="35" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#6d28d9">FR: Politique | DE: Politik</text>

    <!-- Branch line -->
    <line x1="50" y1="82" x2="50" y2="105" stroke="#a78bfa" stroke-width="2"/>
    <line x1="50" y1="105" x2="65" y2="105" stroke="#a78bfa" stroke-width="2"/>

    <!-- Mid Node: Political Behavior -->
    <rect x="65" y="90" width="185" height="34" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="75" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#312e81">Political behaviour</text>
    <text x="75" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">FR: Comportement politique</text>

    <!-- Branch line 2 -->
    <line x1="90" y1="124" x2="90" y2="148" stroke="#a78bfa" stroke-width="2"/>
    <line x1="90" y1="148" x2="105" y2="148" stroke="#a78bfa" stroke-width="2"/>

    <!-- Leaf Node: Voting behaviour -->
    <rect x="105" y="132" width="145" height="34" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="113" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#312e81">Voting behaviour</text>
    <text x="113" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#64748b">FR: Comportement électoral</text>

    <!-- Bridge to ReQuest Variable -->
    <rect x="15" y="185" width="245" height="180" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
    <text x="25" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f766e">🔗 Anchoring to ReQuest Cascade</text>
    
    <text x="25" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">Archivists anchor ConceptualVariables</text>
    <text x="25" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">to standardized ELSST URI identifiers:</text>

    <rect x="25" y="248" width="225" height="42" rx="4" fill="#ffffff" stroke="#99f6e4"/>
    <text x="32" y="264" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#0f766e">ConceptualVariable:</text>
    <text x="32" y="278" font-family="JetBrains Mono, monospace" font-size="7.5" fill="#475569">uri = "https://elsst.cessda.eu/id/..."</text>

    <text x="25" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0f766e">✓ Harmonizes 250+ survey datasets</text>
    <text x="25" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0f766e">✓ Multilingual cross-lingual discovery</text>
    <text x="25" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0f766e">✓ CESSDA European interoperability</text>
  </g>
</svg>
