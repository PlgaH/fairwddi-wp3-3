name: syntactic
description: Level 1 Syntactic & Textual comparison configuration (normalization, punctuation, inclusive writing, wording/typo variants, shared stems, and CodeList hashing).
levels:
  - syntactic
resource_types:
  - QuestionItem
  - RepresentedVariable
  - CodeList
  - Category
  - ConceptualVariable

rules:
  QuestionItem:
    enabled: true
    fields:
      - question_text
      - label
    syntactic:
      min_score: 0.75
      near_exact_threshold: 0.90
      enable_wording_variants: true
      enable_typo_variants: true
      enable_stem_grids: true
      min_stem_len: 12
      enable_token_blocking: true
    semantic:
      enabled: false
    conceptual:
      enabled: false

  RepresentedVariable:
    enabled: true
    fields:
      - label
      - description
      - question_text
    syntactic:
      min_score: 0.75
      near_exact_threshold: 0.90
      enable_wording_variants: true
      enable_typo_variants: true
      enable_stem_grids: true
      min_stem_len: 10
      enable_token_blocking: true
    semantic:
      enabled: false
    conceptual:
      enabled: false

  CodeList:
    enabled: true
    fields:
      - label
      - codes
    syntactic:
      min_score: 0.80
      enable_token_blocking: false
    semantic:
      enabled: false
    conceptual:
      enabled: false

  Category:
    enabled: true
    fields:
      - label
    syntactic:
      min_score: 0.80
      near_exact_threshold: 0.90
      enable_wording_variants: true
      enable_typo_variants: true
      enable_stem_grids: false
      enable_token_blocking: true
    semantic:
      enabled: false
    conceptual:
      enabled: false
    qualification:
      evaluate_codelists: false
      flag_administration_context: false

  ConceptualVariable:
    enabled: true
    fields:
      - label
      - description
    syntactic:
      min_score: 0.75
      enable_token_blocking: true
    semantic:
      enabled: false
    conceptual:
      enabled: false
    qualification:
      evaluate_codelists: false
      flag_administration_context: false
