name: "request_core"
description: "Core ReQuest question bank profile for DDI-Lifecycle 3.x and DDI-Codebook 2.5"
include_types:
  # Question & Instrument Layer
  - QuestionItem
  - QuestionGrid
  - QuestionConstruct
  - QuestionScheme
  - StatementItem
  - Sequence
  - IfThenElse
  - ComputationItem
  - Loop
  - ControlConstructScheme
  - Instrument
  - InstrumentScheme
  - InterviewerInstruction
  - InterviewerInstructionScheme

  # Representation & Code List Layer
  - Category
  - CategorySet
  - CategoryGroup
  - CategoryScheme
  - CodeList
  - CodeListScheme
  - CodeItem

  # Variable Cascade Layer
  - Variable
  - InstanceVariable
  - RepresentedVariable
  - RepresentedVariableGroup
  - RepresentedVariableScheme
  - ConceptualVariable
  - ConceptualVariableGroup
  - ConceptualVariableScheme
  - VariableGroup
  - VariableScheme

  # Concept & Universe Layer
  - Concept
  - ConceptGroup
  - ConceptScheme
  - Universe
  - UniverseScheme

  # Study & Dataset Hierarchy
  - StudyUnit
  - Group
  - DataCollection
  - Organization

exclude_types:
  - VariableStatistics
  - PhysicalInstance
  - PhysicalDataSet
  - OtherMaterial
  - QualityStandard
  - QualityStatement
  - Methodology
  - DDIInstance
  - ResourcePackage

# Automatically retain referenced concepts, code lists, and interviewer instructions
include_referenced_resources: true

strategies:
  on_duplicate_file: "skip"
  on_existing_resource: "insert_new_only"
  on_content_drift: "quarantine"
